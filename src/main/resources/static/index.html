<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Reviewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Expense Reviewer</h2>

        <nav>
          <button class="nav-item active" onclick="showSection('dashboard')">
            Dashboard
          </button>

          <button class="nav-item" onclick="showSection('claims')">
            Claims
          </button>

          <button class="nav-item" onclick="showSection('addClaim')">
            + Add Claim
          </button>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header -->
        <header class="topbar">
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p>Manage and review expense claims</p>
          </div>
        </header>

        <!-- Loading -->
        <div id="loading" class="state-message">Loading claims...</div>

        <!-- Dashboard -->
        <section id="dashboard" class="section">
          <div class="cards">
            <div class="card">
              <h3>Total Claims</h3>
              <p id="totalClaims">0</p>
            </div>

            <div class="card pending">
              <h3>Pending</h3>
              <p id="pendingClaims">0</p>
            </div>

            <div class="card approved">
              <h3>Approved</h3>
              <p id="approvedClaims">0</p>
            </div>

            <div class="card rejected">
              <h3>Rejected</h3>
              <p id="rejectedClaims">0</p>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2>Recent Claims</h2>
              <button onclick="showSection('claims')">View All</button>
            </div>

            <div id="recentClaims"></div>
          </div>
        </section>

        <!-- Claims -->
        <section id="claims" class="section hidden">
          <div class="panel">
            <div class="panel-header">
              <h2>All Claims</h2>

              <div class="filters">
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Search claimant..."
                  oninput="filterClaims()"
                />

                <select id="statusFilter" onchange="filterClaims()">
                  <option value="">All Status</option>
                  <option value="PENDING">Pending</option>
                  <option value="APPROVED">Approved</option>
                  <option value="REJECTED">Rejected</option>
                </select>
              </div>
            </div>

            <div id="claimsTableContainer"></div>
          </div>
        </section>

        <!-- Add Claim -->
        <section id="addClaim" class="section hidden">
          <div class="panel form-panel">
            <h2>Add Expense Claim</h2>

            <form id="claimForm">
              <div class="form-grid">
                <div class="form-group">
                  <label>Claimant</label>
                  <input type="text" id="claimant" required />
                </div>

                <div class="form-group">
                  <label>Date</label>
                  <input type="date" id="date" required />
                </div>

                <div class="form-group">
                  <label>Category</label>
                  <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Travel">Travel</option>
                    <option value="Food">Food</option>
                    <option value="Client Meal">Client Meal</option>
                    <option value="Accommodation">Accommodation</option>
                    <option value="Office Supplies">Office Supplies</option>
                    <option value="Other">Other</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Amount</label>
                  <input
                    type="number"
                    id="amount"
                    min="0.01"
                    step="0.01"
                    required
                  />
                </div>

                <div class="form-group">
                  <label>Currency</label>
                  <select id="currency" required>
                    <option value="INR">INR</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Receipt Available</label>
                  <select id="receiptAvailable">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label>Description</label>
                <textarea
                  id="description"
                  rows="4"
                  placeholder="Enter expense details..."
                ></textarea>
              </div>

              <div id="formMessage" class="form-message"></div>

              <button type="submit" class="primary-button">Submit Claim</button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
